[package]
name = "veilcore-records"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "An independent implementation of the VeilCore record format"
repository = "https://github.com/hunterincoming/veilcore-rs"
homepage = "https://veilcore.org"
keywords = ["provenance", "records", "commitment", "merkle", "standards"]

[dependencies]
sha2 = "0.10"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
unicode-normalization = "0.1"
ryu-js = "1.0.3"
